name: Freeze 1.0 RC dependencies

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: freeze-1.0-rc-dependencies
  cancel-in-progress: true

jobs:
  freeze:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/1.0-rc'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact RC head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Resolve lock without executing package scripts
        shell: bash
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Fail if the supported DSH direct line drifted
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const expected = '0.1.0-rc.8';
          const required = [
            '@deepseek-ai/dsh',
            '@deepseek-ai/dsh-agent',
            '@deepseek-ai/dsh-app-boot',
            '@deepseek-ai/dsh-host-apiproxy',
            '@deepseek-ai/dsh-launch-environment',
            '@deepseek-ai/dsh-llm',
            '@deepseek-ai/dsh-session'
          ];
          for (const name of required) {
            if (pkg.dependencies?.[name] !== expected) {
              throw new Error(`${name} must stay exactly ${expected}; got ${pkg.dependencies?.[name]}`);
            }
          }
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (lock.packages?.['']?.dependencies?.['@deepseek-ai/dsh'] !== expected) {
            throw new Error('generated lock does not preserve the exact DSH root version');
          }
          NODE
      - name: Commit frozen graph back to the RC branch
        shell: bash
        env:
          RC_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json already matches the RC manifest'
            exit 0
          fi
          git config user.name 'dshx-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: freeze RC npm dependency graph'
          git push origin "HEAD:${RC_BRANCH}"
