name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: windows-latest
            label: windows-x64
          - os: macos-26
            label: macos-arm64
          - os: macos-26-intel
            label: macos-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve release version (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: echo "DSHX_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Resolve release version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "DSHX_VERSION=$($env:GITHUB_REF_NAME.TrimStart('v'))"
      - name: Test presentation adapter
        run: |
          npm install
          node scripts/verify-dsh-closure.mjs
          npm test
      - name: Boot official DSH runtime
        run: node scripts/runtime-smoke.mjs
      - name: Build pinned TUI and local IPC bridge (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/build-codex-tui.sh
      - name: Build pinned TUI and local IPC bridge (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-codex-tui.ps1
      - name: Verify local IPC data plane (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: dist/bin/dshx-ipc-bridge --check
      - name: Verify local IPC data plane (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\dist\bin\dshx-ipc-bridge.exe --check
          if ($LASTEXITCODE -ne 0) { throw 'local IPC data-plane self-check failed' }
      - name: Real pinned TUI local-IPC PTY smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 -m pip install --user pexpect
          python3 test/tui_smoke.py
      - name: Install test-only Windows ConPTY bridge
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm install --no-save --package-lock=false node-pty@1.1.0
      - name: Real pinned TUI Windows ConPTY + CJK local-IPC smoke
        if: runner.os == 'Windows'
        run: node test/tui_smoke_windows.mjs
      - name: Build installable platform tarball (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: node scripts/package-platform.mjs
      - name: Build installable platform tarball (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: node scripts/package-platform.mjs
      - name: Clean install smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          TGZ="$(find dist/release -maxdepth 1 -name 'dshx-*.tgz' -print -quit)"
          PREFIX="$RUNNER_TEMP/dshx-release-smoke"
          npm install --global --prefix "$PREFIX" "$TGZ"
          "$PREFIX/bin/dshx" --version | grep -F "$DSHX_VERSION"
          "$PREFIX/bin/dshx" doctor
      - name: Clean install smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tgz = Get-ChildItem dist\release\dshx-*.tgz | Select-Object -First 1
          if (-not $tgz) { throw 'platform tarball missing' }
          $prefix = Join-Path $env:RUNNER_TEMP 'dshx-release-smoke'
          npm install --global --prefix $prefix $tgz.FullName
          $version = & (Join-Path $prefix 'dshx.cmd') --version
          if (-not ($version -match [regex]::Escape($env:DSHX_VERSION))) { throw "wrong dshx version: $version" }
          & (Join-Path $prefix 'dshx.cmd') doctor
      - uses: actions/upload-artifact@v4
        with:
          name: dshx-${{ matrix.label }}
          path: |
            dist/release/*.tgz
            dist/release/*.json
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum dshx-*.tgz > SHA256SUMS
          cat SHA256SUMS
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" artifacts/* "${flags[@]}"
