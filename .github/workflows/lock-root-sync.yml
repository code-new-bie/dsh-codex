name: Lock Root Sync

on:
  push:
    branches: ['automation/lock-root-sync']

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[lock-synced]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: automation/lock-root-sync
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify npm baseline and snapshot non-root dependency graph
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(npm --version)" == 11.* ]] || { echo 'lock sync requires npm 11' >&2; exit 1; }
          node - <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const packages = structuredClone(lock.packages ?? {});
          delete packages[''];
          // npm legitimately recomputes these reachability/classification flags
          // when a former root dependency becomes dev-only/transitive. They do
          // not change package identity or dependency edges.
          for (const record of Object.values(packages)) {
            for (const field of ['dev', 'devOptional', 'optional', 'peer']) delete record[field];
          }
          fs.writeFileSync(process.env.RUNNER_TEMP + '/nonroot-graph.json', JSON.stringify(packages));
          NODE
      - name: Regenerate lock metadata only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Prove package graph is unchanged and root matches package.json
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const before = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/nonroot-graph.json', 'utf8'));
          const after = structuredClone(lock.packages ?? {});
          const root = after[''];
          assert.ok(root, 'lock root record missing');
          delete after[''];
          for (const record of Object.values(after)) {
            for (const field of ['dev', 'devOptional', 'optional', 'peer']) delete record[field];
          }
          assert.deepStrictEqual(after, before, 'npm changed non-root package identity or dependency edges');
          assert.equal(lock.name, pkg.name);
          assert.equal(lock.version, pkg.version);
          assert.equal(root.name, pkg.name);
          assert.equal(root.version, pkg.version);
          for (const field of ['dependencies', 'devDependencies', 'peerDependencies', 'peerDependenciesMeta', 'engines', 'bin']) {
            assert.deepStrictEqual(root[field] ?? {}, pkg[field] ?? {}, `lock root ${field} drift`);
          }
          assert.equal(root.dependencies?.['@deepseek-ai/dsh-cmdline'], undefined);
          assert.equal(root.devDependencies?.ws, undefined);
          NODE
          node scripts/verify-dsh-closure.mjs
          git diff --check
          test -z "$(git status --porcelain -- package.json)"
          git diff --stat -- package-lock.json
      - name: Commit synchronized lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(deps): sync frozen lock metadata [lock-synced]'
          git push origin HEAD:automation/lock-root-sync
