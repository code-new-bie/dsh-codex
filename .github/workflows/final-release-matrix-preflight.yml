name: Final Release Matrix Preflight

on:
  push:
    branches: ['automation/final-release-matrix-87007de3']

permissions:
  contents: read

jobs:
  build:
    name: Preflight / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: windows-latest
            label: windows-x64
          - os: macos-26
            label: macos-arm64
          - os: macos-26-intel
            label: macos-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1f66125248bb8ab1c23c9c440f2eb99ae45cf4ae
      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1f66125248bb8ab1c23c9c440f2eb99ae45cf4ae
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test standard DSH presentation bundle from frozen graph
        run: |
          npm ci --include=optional --ignore-scripts=false
          node scripts/verify-dsh-closure.mjs
          npm test
          node scripts/verify-ownership-boundary.mjs
      - name: Enable pnpm for official plugin machinery
        run: corepack enable pnpm
      - name: Verify official DSH profile lifecycle
        run: node scripts/runtime-smoke.mjs
      - name: Build pinned TUI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          DSHX_VERSION: 1.0.0-ci
        run: bash scripts/build-codex-tui.sh
      - name: Build pinned TUI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DSHX_VERSION: 1.0.0-ci
        run: ./scripts/build-codex-tui.ps1
      - name: Verify profile-owned directional-pipe thin-fork invariants
        run: node scripts/verify-tui-invariants.mjs
      - name: Real pinned TUI PTY + CJK + resize smoke
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/dshx-pty-venv"
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install --disable-pip-version-check pexpect
          "$VENV/bin/python" test/tui_smoke.py
      - name: Real pinned TUI Windows ConPTY + CJK smoke
        if: runner.os == 'Windows'
        run: node test/tui_smoke_windows.mjs
      - name: Build installable platform tarball
        run: node scripts/package-platform.mjs
      - name: Verify release bundle install and profile activation
        env:
          DSHX_REQUIRE_RELEASE: '1'
        run: node scripts/verify-bundle-install.mjs
      - name: Clean install smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          TGZ="$(find dist/release -maxdepth 1 -name 'dshx-*.tgz' -print -quit)"
          test -n "$TGZ"
          PREFIX="$RUNNER_TEMP/dshx-release-smoke"
          npm install --global --prefix "$PREFIX" --include=optional --ignore-scripts=false "$TGZ"
          if npm ls --global --prefix "$PREFIX" @deepseek-ai/dsh --depth=0 >/dev/null 2>&1; then
            echo 'clean DSHX install unexpectedly materialized a second @deepseek-ai/dsh runtime' >&2
            exit 1
          fi
          export DSHX_DSH_BIN="$PWD/node_modules/@deepseek-ai/dsh/lib/bin.js"
          "$PREFIX/bin/dshx" --version | grep -F '0.0.0-m1'
      - name: Clean install smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tgz = Get-ChildItem dist\release\dshx-*.tgz | Select-Object -First 1
          if (-not $tgz) { throw 'platform tarball missing' }
          $prefix = Join-Path $env:RUNNER_TEMP 'dshx-release-smoke'
          npm install --global --prefix $prefix --include=optional --ignore-scripts=false $tgz.FullName
          & npm ls --global --prefix $prefix '@deepseek-ai/dsh' --depth=0 *> $null
          if ($LASTEXITCODE -eq 0) { throw 'clean DSHX install unexpectedly materialized a second @deepseek-ai/dsh runtime' }
          $env:DSHX_DSH_BIN = (Resolve-Path 'node_modules\@deepseek-ai\dsh\lib\bin.js').Path
          $version = & (Join-Path $prefix 'dshx.cmd') --version
          if (-not ($version -match [regex]::Escape('0.0.0-m1'))) { throw "wrong dshx version: $version" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dshx-preflight-${{ matrix.label }}
          path: |
            dist/release/*.tgz
            dist/release/*.json
          if-no-files-found: error

  verify:
    name: Verify cross-platform provenance
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify provenance and checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import hashlib
          import json
          import os

          sidecars = sorted(glob.glob('artifacts/dshx-*.tgz.json'))
          tarballs = sorted(glob.glob('artifacts/dshx-*.tgz'))
          if len(sidecars) != 4 or len(tarballs) != 4:
              raise SystemExit(f'expected 4 tarballs + 4 sidecars, got tarballs={tarballs}, sidecars={sidecars}')
          records = []
          for filename in sidecars:
              with open(filename, encoding='utf-8') as handle:
                  records.append((filename, json.load(handle)))
          keys = ('version', 'dshVersion', 'dshHostRange', 'codexCommit', 'dshCommit', 'transport', 'dependencyGraph', 'sourceLockSha256')
          baseline = {key: records[0][1].get(key) for key in keys}
          if baseline['version'] != '0.0.0-m1':
              raise SystemExit(f"artifact version mismatch: {baseline['version']}")
          if baseline['dshVersion'] != '0.1.0-rc.8':
              raise SystemExit(f"tested DSH mismatch: {baseline['dshVersion']}")
          if baseline['dshHostRange'] != '>=0.1.0-rc.8':
              raise SystemExit(f"host range mismatch: {baseline['dshHostRange']}")
          if baseline['transport'] != 'profile-directional-pipes':
              raise SystemExit(f"transport mismatch: {baseline['transport']}")
          if baseline['dependencyGraph'] != 'source-package-lock':
              raise SystemExit(f"dependency graph mismatch: {baseline['dependencyGraph']}")
          if baseline['codexCommit'] != 'fde2156057c38c0227ce94c8514d04c7498df60d':
              raise SystemExit(f"Codex pin mismatch: {baseline['codexCommit']}")
          lock_hash = baseline['sourceLockSha256']
          if not isinstance(lock_hash, str) or len(lock_hash) != 64 or any(ch not in '0123456789abcdef' for ch in lock_hash):
              raise SystemExit(f'invalid source lock SHA-256: {lock_hash!r}')
          expected_pairs = {('linux', 'x64'), ('win32', 'x64'), ('darwin', 'arm64'), ('darwin', 'x64')}
          actual_pairs = {(record.get('platform'), record.get('arch')) for _, record in records}
          if actual_pairs != expected_pairs:
              raise SystemExit(f'platform/arch matrix mismatch: {actual_pairs} != {expected_pairs}')
          for filename, record in records[1:]:
              current = {key: record.get(key) for key in keys}
              if current != baseline:
                  raise SystemExit(f'cross-platform provenance mismatch in {filename}: {current} != {baseline}')
          entries = []
          for filename in tarballs + sidecars:
              with open(filename, 'rb') as handle:
                  digest = hashlib.sha256(handle.read()).hexdigest()
              entries.append((digest, os.path.basename(filename)))
          if len(entries) != 8 or len({name for _, name in entries}) != 8:
              raise SystemExit(f'invalid checksum input set: {entries}')
          with open('artifacts/SHA256SUMS', 'w', encoding='utf-8') as handle:
              for digest, name in entries:
                  handle.write(f'{digest}  {name}\n')
          print(json.dumps(baseline, sort_keys=True))
          print(open('artifacts/SHA256SUMS', encoding='utf-8').read(), end='')
          PY
