name: Windows npm bundle fix

on:
  push:
    branches: ['automation/windows-npm-bundle-fix']

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: automation/windows-npm-bundle-fix
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install frozen graph
        run: npm ci --include=optional --ignore-scripts=false
      - name: Enable official profile machinery
        run: corepack enable pnpm
      - name: Verify validated source shape
        run: |
          node --check scripts/verify-bundle-install.mjs
          node scripts/verify-lock-root.mjs
          node scripts/verify-dsh-closure.mjs . package-lock.json
      - name: Prove source bundle install and profile activation on Windows
        run: node scripts/verify-bundle-install.mjs
