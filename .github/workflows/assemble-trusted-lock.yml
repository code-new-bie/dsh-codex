name: Assemble trusted DSHX lock

on:
  push:
    branches: [prep/post-lock-rc]
    paths:
      - '.dshx-lock-upload/**'
      - '.github/workflows/assemble-trusted-lock.yml'

permissions:
  contents: write

concurrency:
  group: assemble-trusted-dshx-lock
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact prep head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Reconstruct exact trusted package lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .dshx-lock-upload -maxdepth 1 -name 'part-*.b64' | wc -l)" -eq 8
          cat .dshx-lock-upload/part-*.b64 | base64 --decode | gzip --decompress > package-lock.json
          echo 'e986709214d9228a72eae80443247788f3be9d627f2eaa8e5a97fba6012f5477  package-lock.json' | sha256sum --check -
          node scripts/verify-dsh-closure.mjs . package-lock.json
      - name: Commit exact lock and remove transport state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dshx-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- package-lock.json
          git rm -r -- .dshx-lock-upload .github/workflows/assemble-trusted-lock.yml
          git commit -m 'chore: freeze trusted RC dependency graph'
          git push origin HEAD:prep/post-lock-rc

# Trigger recorded after all eight trusted lock chunks are present.
