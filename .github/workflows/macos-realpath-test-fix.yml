name: Profile Bootstrap Realpath Fix

on:
  push:
    branches: ['automation/macos-realpath-test-fix']

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Run profile bootstrap test
        run: node --test --test-force-exit test/dshx-profile-bootstrap.test.mjs
