name: Freeze RC dependencies

on:
  push:
    branches: ['release/1.0-rc']
    paths:
      - package.json
      - .github/workflows/freeze-dependencies.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: freeze-rc-dependencies
  cancel-in-progress: true

jobs:
  lock:
    if: github.repository == 'code-new-bie/dsh-codex'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0-rc
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - name: Resolve exact npm graph without running install scripts
        shell: bash
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify DeepSeek Harness closure remains the supported rc.8 line
        shell: bash
        run: node scripts/verify-dsh-closure.mjs . package-lock.json
      - name: Commit frozen graph when it changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json is already frozen'
            exit 0
          fi
          git config user.name 'dshx-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: freeze RC npm dependency graph'
          git push origin HEAD:release/1.0-rc
