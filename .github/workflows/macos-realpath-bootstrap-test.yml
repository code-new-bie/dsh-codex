name: Bootstrap Shim Canonical Path Contract

on:
  push:
    branches: ['automation/macos-realpath-bootstrap-test']

permissions:
  contents: read

jobs:
  shim-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: node --test test/dshx-profile-bootstrap.test.mjs
