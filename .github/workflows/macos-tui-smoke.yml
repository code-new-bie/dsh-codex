name: macOS TUI Smoke

on:
  push:
    branches: [main, 'work/**', 'agent/**', 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-tui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pty:
    name: macOS PTY / pinned Codex TUI / local IPC
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Install frozen dependency graph
        run: npm ci
      - name: Verify exact DeepSeek Harness release closure
        run: node scripts/verify-dsh-closure.mjs
      - name: Build pinned Codex TUI + local IPC bridge
        shell: bash
        run: bash scripts/build-codex-tui.sh
      - name: Verify macOS local IPC data plane
        shell: bash
        run: dist/bin/dshx-ipc-bridge --check
      - name: Exercise real TUI through macOS PTY + CJK + resize
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/dshx-pty-venv"
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install --disable-pip-version-check pexpect
          "$VENV/bin/python" test/tui_smoke.py
