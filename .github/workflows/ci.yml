name: CI

on:
  push:
    branches: [main, 'work/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - name: Verify exact DeepSeek Harness release closure
        run: node scripts/verify-dsh-closure.mjs
      - run: npm test
      - name: Syntax check all shipped JavaScript (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do node --check "$file"; done < <(find src bin scripts -type f -name '*.mjs' -print | sort)
      - name: Syntax check all shipped JavaScript (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem src,bin,scripts -Recurse -Filter *.mjs | Sort-Object FullName | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "syntax check failed: $($_.FullName)" }
          }
      - name: Syntax check PTY smoke
        if: runner.os != 'Windows'
        run: python3 -m py_compile test/tui_smoke.py

  dsh-runtime:
    name: Official DSH runtime / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Verify exact DeepSeek Harness release closure
        run: node scripts/verify-dsh-closure.mjs
      - name: Boot and dispose official DeepSeek Harness composition
        run: node scripts/runtime-smoke.mjs

  codex-tui-package:
    name: Pinned TUI + package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build pinned Codex TUI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/build-codex-tui.sh
      - name: Build pinned Codex TUI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-codex-tui.ps1
      - name: Assert thin-fork invariants (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          MAIN=.upstream/codex/codex-rs/tui/src/main.rs
          LIB=.upstream/codex/codex-rs/tui/src/lib.rs
          APP=.upstream/codex/codex-rs/tui/src/app.rs
          SESSION=.upstream/codex/codex-rs/tui/src/app_server_session.rs
          SLASH=.upstream/codex/codex-rs/tui/src/slash_command.rs
          STARTUP=.upstream/codex/codex-rs/tui/src/app/startup.rs
          EVENT=.upstream/codex/codex-rs/tui/src/app/event_dispatch.rs
          grep -q 'DSHX_APP_SERVER_ENDPOINT is required' "$MAIN"
          grep -q 'DSHX_APP_SERVER_TOKEN is required' "$MAIN"
          grep -q 'Some(dshx_endpoint)' "$MAIN"
          grep -q 'DSHX_RESUME_MODE' "$MAIN"
          grep -q 'DeepSeek Harness' .upstream/codex/codex-rs/tui/src/history_cell/session.rs
          grep -q 'fn dshx_backend' .upstream/codex/codex-rs/tui/src/bottom_pane/approval_overlay.rs
          grep -q 'fn dshx_backend' .upstream/codex/codex-rs/tui/src/chatwidget/permission_popups.rs
          grep -q 'fn dshx_backend' "$LIB"
          grep -q '!dshx_backend()' "$LIB"
          grep -q '!crate::dshx_backend()' "$STARTUP"
          grep -q '!crate::dshx_backend()' "$EVENT"
          grep -q 'ThreadParamsMode::Remote' "$SESSION"
          grep -q 'dshx resume' "$APP"
          grep -q 'if crate::dshx_backend()' "$SLASH"
          grep -q 'DeepSeek Harness' "$SLASH"
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.upstream/codex/codex-rs/tui/src/slash_command.rs').read_text()
          start = text.index('if crate::dshx_backend()')
          end = text.index('return false;', start)
          hidden = text[start:end]
          if 'SlashCommand::Diff' in hidden:
              raise SystemExit('/diff must remain visible in DSHX now that command/exec is DSH-backed')
          PY
      - name: Assert thin-fork invariants (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $main = Get-Content .upstream\codex\codex-rs\tui\src\main.rs -Raw
          if (-not $main.Contains('DSHX_APP_SERVER_ENDPOINT is required')) { throw 'missing DSHX endpoint guard' }
          if (-not $main.Contains('DSHX_APP_SERVER_TOKEN is required')) { throw 'missing DSHX token guard' }
          if (-not $main.Contains('Some(dshx_endpoint)')) { throw 'Codex core fallback was not removed' }
          if (-not $main.Contains('DSHX_RESUME_MODE')) { throw 'DSHX resume patch is missing' }
          $header = Get-Content .upstream\codex\codex-rs\tui\src\history_cell\session.rs -Raw
          if (-not $header.Contains('DeepSeek Harness')) { throw 'DSHX branding patch is missing' }
          $approval = Get-Content .upstream\codex\codex-rs\tui\src\bottom_pane\approval_overlay.rs -Raw
          if (-not $approval.Contains('fn dshx_backend')) { throw 'DSHX approval semantics patch is missing' }
          $permissions = Get-Content .upstream\codex\codex-rs\tui\src\chatwidget\permission_popups.rs -Raw
          if (-not $permissions.Contains('fn dshx_backend')) { throw 'DSHX permission picker patch is missing' }
          $lib = Get-Content .upstream\codex\codex-rs\tui\src\lib.rs -Raw
          if (-not $lib.Contains('fn dshx_backend')) { throw 'DSHX onboarding ownership patch is missing' }
          $startup = Get-Content .upstream\codex\codex-rs\tui\src\app\startup.rs -Raw
          if (-not $startup.Contains('!crate::dshx_backend()')) { throw 'DSHX startup ownership patch is missing' }
          $event = Get-Content .upstream\codex\codex-rs\tui\src\app\event_dispatch.rs -Raw
          if (-not $event.Contains('!crate::dshx_backend()')) { throw 'DSHX config ownership patch is missing' }
          $session = Get-Content .upstream\codex\codex-rs\tui\src\app_server_session.rs -Raw
          if (-not $session.Contains('ThreadParamsMode::Remote')) { throw 'DSHX thread ownership patch is missing' }
          $app = Get-Content .upstream\codex\codex-rs\tui\src\app.rs -Raw
          if (-not $app.Contains('dshx')) { throw 'DSHX resume hint patch is missing' }
          $slash = Get-Content .upstream\codex\codex-rs\tui\src\slash_command.rs -Raw
          if (-not $slash.Contains('if crate::dshx_backend()')) { throw 'DSHX slash capability patch is missing' }
          if (-not $slash.Contains('DeepSeek Harness')) { throw 'DSHX slash branding is missing' }
          $hiddenStart = $slash.IndexOf('if crate::dshx_backend()')
          $hiddenEnd = $slash.IndexOf('return false;', $hiddenStart)
          if ($hiddenStart -lt 0 -or $hiddenEnd -lt 0) { throw 'DSHX slash hidden block not found' }
          $hidden = $slash.Substring($hiddenStart, $hiddenEnd - $hiddenStart)
          if ($hidden.Contains('SlashCommand::Diff')) { throw '/diff must remain visible in DSHX now that command/exec is DSH-backed' }
      - name: Real pinned TUI PTY smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npm install
          node scripts/verify-dsh-closure.mjs
          python3 -m pip install --user pexpect
          python3 test/tui_smoke.py
      - name: Build installable platform tarball
        shell: bash
        if: runner.os != 'Windows'
        run: node scripts/package-platform.mjs
      - name: Build installable platform tarball (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: node scripts/package-platform.mjs
      - name: Clean-install smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          TGZ="$(find dist/release -maxdepth 1 -name 'dshx-*.tgz' -print -quit)"
          PREFIX="$RUNNER_TEMP/dshx-smoke"
          npm install --global --prefix "$PREFIX" "$TGZ"
          "$PREFIX/bin/dshx" --version
          "$PREFIX/bin/dshx" doctor
      - name: Clean-install smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tgz = Get-ChildItem dist\release\dshx-*.tgz | Select-Object -First 1
          if (-not $tgz) { throw 'platform tarball missing' }
          $prefix = Join-Path $env:RUNNER_TEMP 'dshx-smoke'
          npm install --global --prefix $prefix $tgz.FullName
          & (Join-Path $prefix 'dshx.cmd') --version
          & (Join-Path $prefix 'dshx.cmd') doctor
      - uses: actions/upload-artifact@v4
        with:
          name: dshx-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/release/*.tgz
            dist/release/*.json
          if-no-files-found: error

  ownership-guard:
    name: Ownership boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert architecture contract exists
        shell: bash
        run: |
          grep -q "must not grow into an agent framework" docs/ARCHITECTURE.md
          grep -q "DeepSeek Harness remains an upstream dependency" docs/TEAM.md
      - name: Assert production runtime remains official DSH composition
        shell: bash
        run: |
          grep -q "dsh-base" src/dsh/runtime-boot.mjs
          grep -q "dsh-headless" src/dsh/runtime-boot.mjs
          grep -q "startup: { disabled: true }" src/dsh/runtime-boot.mjs
      - name: Assert shell and workspace execution remain DSH-owned
        shell: bash
        run: |
          ! grep -E "execFile|execSync|spawn\(" src/dsh/user-shell.mjs src/dsh/workspace-command.mjs
          grep -q "tools.execute" src/dsh/user-shell.mjs
          grep -q "agent: controller.agent" src/dsh/user-shell.mjs
          grep -q "tools.execute" src/dsh/workspace-command.mjs
          grep -q "agent" src/dsh/workspace-command.mjs
          grep -q "case 'command/exec'" src/dsh/release-adapter.mjs
      - name: Assert fork and compaction domain semantics remain DSH-owned
        shell: bash
        run: |
          grep -q "@deepseek-ai/dsh-host-apiproxy" src/dsh/host-api.mjs
          grep -q "api.sessions.fork" src/dsh/host-api.mjs
          grep -q "executeDshCommand" src/dsh/product-adapter.mjs
          grep -q "commands.execute" src/dsh/commands.mjs
          ! grep -q "compactNow" src/dsh/product-adapter.mjs
          ! grep -E "seedLength|parentSession|dshForkSeed" src/dsh/agent-driver.mjs src/dsh/product-adapter.mjs
          ! grep -q "fork(sourceAgent" src/dsh/agent-driver.mjs
