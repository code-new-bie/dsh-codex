# The DSHX surface bundle patch, riding over this profile's dsh-base layer.
# Loaded automatically because the package manifest declares
# `dsh.bundle.patch`; the loader applies it in `dsh.profile.bundles` order.
#
# Only the competing presentation rows are locked off; every runtime
# capability row remains user-authoritative (a targeted patch replaces a
# row's whole config, and these two carry no config of their own).
#
# Launch inputs flow through the official three-stage pattern: the
# dshx-startup row resolves the launcher/environment descriptor and provides
# the `dshxStartup` service; the dshx-presentation row injects it to start
# the local IPC transport and publish the `dshxPresentation` endpoint.
- id: headless-startup
  disabled: true
- id: headless-runner
  disabled: true

- insert:
    - id: dshx-startup
      name: '@code-new-bie/dshx-tui/startup'

    - id: dshx-presentation
      name: '@code-new-bie/dshx-tui/presentation'
      inject: [dshxStartup]
